[project]
name = "knowledge-graph-rag"
version = "0.1.0"
description = "A local LLM-powered pipeline for transforming unstructured text into knowledge graphs and grounded question answering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "neo4j>=6.4.1",
    "nltk>=3.10.4",
    "openai>=3.50.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
graphrag = "graphrag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
